[project]
name = "scada-connectors"
version = "0.1.0"
description = "Sensor ingress: HTTP + MQTT, API keys, vendor adapters -> stream:events"
requires-python = ">=3.12"
dependencies = [
    "scada-common",
    "scada-db",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "aiomqtt>=2.3",
    "redis>=5.0",
    "prometheus-client>=0.20",
    "prometheus-fastapi-instrumentator>=7.0",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["scada_connectors*"]
