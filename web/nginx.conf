# Same paths as the Vite dev proxy (vite.config.ts): the app only ever talks to its own origin.
map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 80;
  root /usr/share/nginx/html;

  location /api/ {
    proxy_pass http://api:8000/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 3600s;  # the live WebSocket stays open
    client_max_body_size 10m;  # sensor CSV uploads
  }

  location /sim/ {
    proxy_pass http://simulator:8010/;
  }

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # SPA: unknown paths are client-side routes
  location / {
    try_files $uri /index.html;
    add_header Cache-Control "no-cache";
  }
}
