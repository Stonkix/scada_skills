name: scada

# Connection settings for containers that talk to the stores (inside the compose network).
x-storage-env: &storage-env
  POSTGRES_HOST: postgres
  POSTGRES_PORT: 5432
  POSTGRES_DB: ${POSTGRES_DB}
  POSTGRES_USER: ${POSTGRES_USER}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
  CLICKHOUSE_HOST: clickhouse
  CLICKHOUSE_HTTP_PORT: 8123
  CLICKHOUSE_DB: ${CLICKHOUSE_DB}
  CLICKHOUSE_USER: ${CLICKHOUSE_USER}
  CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
  REDIS_URL: redis://redis:6379/0
  MQTT_HOST: mosquitto
  MQTT_PORT: 1883

services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports: ["${POSTGRES_PORT}:5432"]
    volumes: [pg-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20

  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ports: ["${CLICKHOUSE_HTTP_PORT}:8123", "${CLICKHOUSE_NATIVE_PORT}:9000"]
    volumes: [ch-data:/var/lib/clickhouse]
    ulimits:
      nofile: {soft: 262144, hard: 262144}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8123/ping || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["${REDIS_PORT}:6379"]
    volumes: [redis-data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  mosquitto:
    image: eclipse-mosquitto:2.0
    ports: ["${MQTT_PORT}:1883"]
    volumes: [./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro]
    healthcheck:
      test: ["CMD", "mosquitto_sub", "-t", "$$SYS/broker/uptime", "-C", "1", "-W", "3"]
      interval: 5s
      timeout: 5s
      retries: 20

  # One-shot: migrations (PG + CH), Redis consumer groups, demo seed into an empty registry.
  db-init:
    build:
      context: ..
      dockerfile: db/Dockerfile
    environment:
      <<: *storage-env
      SIMULATOR_API_KEY: ${SIMULATOR_API_KEY}
      DEMO_VENDOR_API_KEY: ${DEMO_VENDOR_API_KEY}
    depends_on:
      postgres: {condition: service_healthy}
      clickhouse: {condition: service_healthy}
      redis: {condition: service_healthy}
    restart: "no"

  # Level 3: sensor ingress over HTTP + MQTT -> stream:events
  connectors:
    build:
      context: ..
      dockerfile: connectors/Dockerfile
    environment:
      <<: *storage-env
    ports: ["${CONNECTORS_PORT}:8001"]
    depends_on:
      db-init: {condition: service_completed_successfully}
      mosquitto: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Stream processing: stream:events -> ClickHouse, live state in Redis, alert rules
  worker:
    build:
      context: ..
      dockerfile: worker/Dockerfile
    environment:
      <<: *storage-env
    depends_on:
      db-init: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "python", "-m", "scada_worker.health"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  # Demo traffic and scenarios; talks only to connectors, like real devices
  simulator:
    build:
      context: ..
      dockerfile: simulator/Dockerfile
    environment:
      <<: *storage-env
      CONNECTORS_URL: http://connectors:8001
      SIMULATOR_API_KEY: ${SIMULATOR_API_KEY}
    ports: ["${SIMULATOR_PORT}:8010"]
    depends_on:
      connectors: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8010/health')"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ..
      dockerfile: api/Dockerfile
    ports: ["${API_PORT}:8000"]
    environment:
      <<: *storage-env
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      db-init: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Frontend: static build behind nginx, which also proxies /api (with WebSocket) and /sim
  web:
    build:
      context: ../web
    ports: ["${WEB_PORT}:80"]
    depends_on:
      api: {condition: service_healthy}
      simulator: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pg-data:
  ch-data:
  redis-data:
