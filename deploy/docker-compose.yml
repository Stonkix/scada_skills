name: scada

# Connection settings for containers that talk to the stores (inside the compose network).
x-storage-env: &storage-env
  POSTGRES_HOST: postgres
  POSTGRES_PORT: 5432
  POSTGRES_DB: ${POSTGRES_DB}
  POSTGRES_USER: ${POSTGRES_USER}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
  CLICKHOUSE_HOST: clickhouse
  CLICKHOUSE_HTTP_PORT: 8123
  CLICKHOUSE_DB: ${CLICKHOUSE_DB}
  CLICKHOUSE_USER: ${CLICKHOUSE_USER}
  CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
  REDIS_URL: redis://redis:6379/0
  MQTT_HOST: mosquitto
  MQTT_PORT: 1883

services:
  postgres:
    restart: unless-stopped
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports: ["${POSTGRES_PORT}:5432"]
    volumes: [pg-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20

  clickhouse:
    restart: unless-stopped
    image: clickhouse/clickhouse-server:24.8
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ports: ["${CLICKHOUSE_HTTP_PORT}:8123", "${CLICKHOUSE_NATIVE_PORT}:9000"]
    volumes: [ch-data:/var/lib/clickhouse]
    ulimits:
      nofile: {soft: 262144, hard: 262144}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8123/ping || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 30

  redis:
    restart: unless-stopped
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["${REDIS_PORT}:6379"]
    volumes: [redis-data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  mosquitto:
    restart: unless-stopped
    image: eclipse-mosquitto:2.0
    ports: ["${MQTT_PORT}:1883"]
    volumes: [./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro]
    healthcheck:
      test: ["CMD", "mosquitto_sub", "-t", "$$SYS/broker/uptime", "-C", "1", "-W", "3"]
      interval: 5s
      timeout: 5s
      retries: 20

  # One-shot: migrations (PG + CH), Redis consumer groups, demo seed into an empty registry.
  db-init:
    build:
      context: ..
      dockerfile: db/Dockerfile
    environment:
      <<: *storage-env
      SIMULATOR_API_KEY: ${SIMULATOR_API_KEY}
      DEMO_VENDOR_API_KEY: ${DEMO_VENDOR_API_KEY}
    depends_on:
      postgres: {condition: service_healthy}
      clickhouse: {condition: service_healthy}
      redis: {condition: service_healthy}
    restart: "no"

  # Level 3: sensor ingress over HTTP + MQTT -> stream:events
  connectors:
    restart: unless-stopped
    build:
      context: ..
      dockerfile: connectors/Dockerfile
    environment:
      <<: *storage-env
    ports: ["${CONNECTORS_PORT}:8001"]
    depends_on:
      db-init: {condition: service_completed_successfully}
      mosquitto: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Stream processing: stream:events -> ClickHouse, live state in Redis, alert rules
  worker:
    restart: unless-stopped
    build:
      context: ..
      dockerfile: worker/Dockerfile
    environment:
      <<: *storage-env
    depends_on:
      db-init: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "python", "-m", "scada_worker.health"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  # Demo traffic and scenarios; talks only to connectors, like real devices
  simulator:
    restart: unless-stopped
    build:
      context: ..
      dockerfile: simulator/Dockerfile
    environment:
      <<: *storage-env
      CONNECTORS_URL: http://connectors:8001
      SIMULATOR_API_KEY: ${SIMULATOR_API_KEY}
    ports: ["${SIMULATOR_PORT}:8010"]
    depends_on:
      connectors: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8010/health')"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    restart: unless-stopped
    build:
      context: ..
      dockerfile: api/Dockerfile
    ports: ["${API_PORT}:8000"]
    environment:
      <<: *storage-env
      JWT_SECRET: ${JWT_SECRET}
      # addresses shown on the connectors page: how devices outside docker reach level 3
      PUBLIC_CONNECTORS_URL: http://localhost:${CONNECTORS_PORT}
      PUBLIC_MQTT_HOST: localhost
      PUBLIC_MQTT_PORT: ${MQTT_PORT}
    depends_on:
      db-init: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Frontend: static build behind nginx, which also proxies /api (with WebSocket) and /sim
  web:
    restart: unless-stopped
    build:
      context: ../web
    ports: ["${WEB_PORT}:80"]
    depends_on:
      api: {condition: service_healthy}
      simulator: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]  # alpine resolves localhost to ::1; nginx listens on IPv4
      interval: 5s
      timeout: 3s
      retries: 10

  # --- observability (optional): python dev.py obs -----------------------------------------
  prometheus:
    image: prom/prometheus:v2.53.0
    profiles: [observability]
    restart: unless-stopped
    volumes: [./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro]
    ports: ["${PROMETHEUS_PORT}:9090"]

  grafana:
    image: grafana/grafana:11.1.0
    profiles: [observability]
    restart: unless-stopped
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"  # read-only dashboards without login on the demo stand
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/scada.json
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["${GRAFANA_PORT}:3000"]
    depends_on: [prometheus]

volumes:
  pg-data:
  ch-data:
  redis-data:
