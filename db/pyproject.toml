[project]
name = "scada-db"
version = "0.1.0"
description = "Storage layer: Postgres models + migrations, ClickHouse schema, Redis init, demo seed"
requires-python = ">=3.12"
dependencies = [
    "scada-common",
    "sqlalchemy>=2.0",
    "geoalchemy2>=0.15",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "clickhouse-connect>=0.8",
    "redis>=5.0",
    "argon2-cffi>=23.1",
    "faker>=25",
    "shapely>=2.0",
]

[project.scripts]
scada-db = "scada_db.__main__:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["scada_db*"]

[tool.setuptools.package-data]
scada_db = ["clickhouse/*.sql", "migrations/*.py", "migrations/versions/*.py", "alembic.ini"]
