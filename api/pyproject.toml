[project]
name = "scada-api"
version = "0.1.0"
description = "SCADA API: gateway, registry, layout, alerts, auth, live (modular monolith)"
requires-python = ">=3.12"
dependencies = [
    "scada-common",
    "scada-db",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "python-multipart>=0.0.9",
    "shapely>=2.0",
    "pyjwt>=2.8",
    "argon2-cffi>=23.1",
    "redis>=5.0",
    "clickhouse-connect>=0.8",
    "tzdata",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
