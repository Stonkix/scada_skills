[project]
name = "scada-common"
version = "0.1.0"
description = "Shared contracts (event schema, Redis keys) for all SCADA processes"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.7"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["scada_common*"]
